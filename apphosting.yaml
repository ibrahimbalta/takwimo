# Firebase App Hosting configuration for TAKWİMO (Next.js SSR + API Routes)
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 4

env:
  - variable: NODE_ENV
    value: production
  - variable: NEXT_PUBLIC_APP_URL
    value: https://takwimo.web.app
  # Configure the following secrets in Firebase App Hosting / Secret Manager before going live:
  # - DATABASE_URL, DIRECT_URL
  # - SESSION_SECRET, ENCRYPTION_MASTER_KEY, CRON_SECRET
  # - META_APP_ID, META_APP_SECRET, META_EMBEDDED_SIGNUP_CONFIG_ID, WHATSAPP_WEBHOOK_VERIFY_TOKEN
  # - GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REDIRECT_URI
  # - RESEND_API_KEY, EMAIL_FROM
  # - IYZICO_API_KEY, IYZICO_SECRET_KEY
  # - UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN
